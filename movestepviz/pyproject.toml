[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "movestepviz"
version = "0.2.3"
description = "A CLI and Python library for DNA-strip visualizations of rhetorical move-step structures in text."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
]

[project.scripts]
movestepviz = "movestepviz.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
movestepviz = ["data/*.json"]
"*" = ["*.json"]
